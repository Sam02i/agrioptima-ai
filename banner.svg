<svg width="1900" height="500" viewBox="0 0 1900 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="1900" height="500" rx="18" ry="18"/>
    </clipPath>

    <linearGradient id="baseFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a1f"/>
      <stop offset="100%" stop-color="#153f2e"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eaffb0" stop-opacity="0"/>
      <stop offset="45%" stop-color="#c7f633" stop-opacity="1"/>
      <stop offset="55%" stop-color="#eaffb0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c7f633" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform"
        type="translate"
        from="-1900 0" to="1900 0"
        dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1900" height="500" rx="18" ry="18" fill="url(#baseFill)"/>

  <g clip-path="url(#frame)">
    <image href="vineyard-bg.png" xlink:href="vineyard-bg.png" x="-70" y="0" width="2040" height="500"
           preserveAspectRatio="xMidYMid slice">
      <animateTransform attributeName="transform"
        type="translate"
        values="-35 0; 0 0; -35 0"
        dur="42s"
        repeatCount="indefinite"/>
    </image>
  </g>

  <rect x="0" y="0" width="1900" height="500" rx="18" ry="18" fill="none" stroke="#c7f633" stroke-opacity="0.35" stroke-width="2"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="920" y="215" font-size="78" font-weight="700" fill="#f4fbe9" letter-spacing="1">
      AgriOptima<tspan font-size="34" dy="-38" dx="2" fill="#c7f633">AI</tspan>
    </text>
    <text x="920" y="215" font-size="78" font-weight="700" fill="url(#shimmer)" letter-spacing="1" opacity="0.8">
      AgriOptima<tspan font-size="34" dy="-38" dx="2">AI</tspan>
    </text>

    <text x="950" y="268" font-size="26" fill="#d9e8dc" letter-spacing="0.4">
      From soil intelligence to trusted sale — one connected agricultural platform
    </text>
  </g>

  <g opacity="0.9">
    <circle cx="150" cy="110" r="3" fill="#c7f633">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1760" cy="140" r="3" fill="#c7f633">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1650" cy="370" r="2.5" fill="#eaffb0">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="390" r="2.5" fill="#eaffb0">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
